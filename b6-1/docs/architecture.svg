<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="700" viewBox="0 0 1140 700" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9" fill="none" stroke="#3D3D3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="1140" height="700" fill="#FFFFFF"/>

<text x="40" y="52" font-size="24" font-weight="500" fill="#1A1A18">AWS 웹 서비스 인프라 아키텍처</text>
<text x="40" y="78" font-size="14" fill="#5F5E5A">리전: ap-northeast-2 (서울)  ·  계정 IAM 사용자: cody-iam  ·  작성일: 2026-08-10</text>

<rect x="250" y="140" width="850" height="410" rx="16" fill="#F7F5FF" stroke="#6B5FBF" stroke-width="1.5"/>
<text x="272" y="172" font-size="15" font-weight="500" fill="#3C3489">VPC</text>
<text x="272" y="194" font-size="13" fill="#534AB7">10.0.0.0/16</text>

<rect x="490" y="222" width="580" height="300" rx="12" fill="#EDF7F1" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="512" y="252" font-size="15" font-weight="500" fill="#1B5E3A">Public Subnet</text>
<text x="512" y="273" font-size="13" fill="#2E7D4F">10.0.1.0/24  ·  ap-northeast-2a  ·  퍼블릭 IP 자동 할당 ON</text>

<rect x="565" y="300" width="465" height="185" rx="10" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="580" y="322" font-size="13" font-weight="500" fill="#A32D2D">Security Group  ·  인바운드: TCP 22 (My IP) / TCP 80 (0.0.0.0/0)</text>

<rect x="595" y="340" width="405" height="125" rx="10" fill="#FDF3E2" stroke="#BA7517" stroke-width="1.5"/>
<text x="616" y="370" font-size="15" font-weight="500" fill="#854F0B">EC2 인스턴스  ·  cody-server</text>
<text x="616" y="394" font-size="13" fill="#8A6420">t3.micro  ·  Amazon Linux 2023  ·  ap-northeast-2a</text>
<text x="616" y="416" font-size="13" fill="#8A6420">Private IP 10.0.1.224  ·  Public IP 15.165.74.3</text>
<text x="616" y="440" font-size="13" fill="#8A6420">Nginx 1.30.4 (active / running, :80)</text>

<rect x="290" y="320" width="140" height="80" rx="10" fill="#E9F2FC" stroke="#185FA5" stroke-width="1.5"/>
<text x="360" y="352" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Internet</text>
<text x="360" y="374" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle">Gateway</text>

<rect x="272" y="422" width="198" height="118" rx="10" fill="#E4F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="290" y="449" font-size="14" font-weight="500" fill="#085041">라우팅 테이블</text>
<text x="290" y="472" font-size="12.5" fill="#0F6E56">Public Subnet 명시적 연결</text>
<text x="290" y="500" font-size="12.5" fill="#0F6E56">10.0.0.0/16 → local</text>
<text x="290" y="522" font-size="12.5" fill="#0F6E56">0.0.0.0/0 → igw (Active)</text>

<path d="M472 470 L 488 470" fill="none" stroke="#0F6E56" stroke-width="1.3" stroke-dasharray="5 4"/>

<rect x="40" y="320" width="160" height="80" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="120" y="352" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">외부 사용자</text>
<text x="120" y="374" font-size="12.5" fill="#5F5E5A" text-anchor="middle">브라우저 / SSH 클라이언트</text>

<line x1="205" y1="360" x2="283" y2="360" stroke="#3D3D3A" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="244" y="348" font-size="12" fill="#3D3D3A" text-anchor="middle">①</text>

<line x1="435" y1="360" x2="588" y2="360" stroke="#3D3D3A" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="512" y="348" font-size="12" fill="#3D3D3A" text-anchor="middle">②</text>

<rect x="40" y="450" width="200" height="110" rx="10" fill="#FCEDF2" stroke="#993556" stroke-width="1.5"/>
<text x="60" y="478" font-size="14" font-weight="500" fill="#72243E">IAM 사용자</text>
<text x="60" y="501" font-size="12.5" fill="#993556">cody-iam</text>
<text x="60" y="522" font-size="12.5" fill="#993556">AmazonEC2FullAccess</text>
<text x="60" y="543" font-size="12.5" fill="#993556">AdministratorAccess 미부여</text>

<path d="M240 505 L 258 505 L 258 300 L 258 260" fill="none" stroke="#993556" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="268" y="252" font-size="12" fill="#993556">콘솔 / API 제어 (관리 평면)</text>

<text x="40" y="612" font-size="14" font-weight="500" fill="#1A1A18">트래픽 흐름</text>
<text x="40" y="637" font-size="13" fill="#3D3D3A">① 외부 요청(HTTP :80 / SSH :22)이 인터넷을 거쳐 VPC의 Internet Gateway에 도달</text>
<text x="40" y="659" font-size="13" fill="#3D3D3A">② 라우팅 테이블의 0.0.0.0/0 경로를 따라 Public Subnet으로 전달 → Security Group이 포트·소스 IP를 검사 → 허용된 요청만 EC2의 Nginx에 도달</text>
<text x="40" y="681" font-size="13" fill="#3D3D3A">아웃바운드(curl https://example.com)는 역방향으로 EC2 → 라우팅 테이블 → Internet Gateway → 인터넷 경로를 사용</text>
</svg>
